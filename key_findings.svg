<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="title desc">
  <title id="title">会话转化率：新访客 24.91%，回访访客 13.93%，整体 15.47%</title>
  <desc id="desc">UCI Online Shoppers 全量 12,330 条会话。各组柱形高度按转化率绘制。</desc>
  <rect width="860" height="390" fill="#ffffff"/>
  <text x="42" y="50" fill="#202b33" font-family="Arial, sans-serif" font-size="25" font-weight="700">访客类型与购买转化率</text>
  <text x="42" y="80" fill="#52616b" font-family="Arial, sans-serif" font-size="14">全量数据 · 12,330 条会话 · Revenue = TRUE</text>
  <line x1="80" y1="310" x2="790" y2="310" stroke="#aab4ba" stroke-width="2"/>
  <rect x="140" y="111" width="130" height="199" fill="#087f73"/>
  <rect x="365" y="199" width="130" height="111" fill="#df7a24"/>
  <rect x="590" y="186" width="130" height="124" fill="#51667d"/>
  <g fill="#202b33" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="205" y="99">24.91%</text>
    <text x="430" y="187">13.93%</text>
    <text x="655" y="174">15.47%</text>
  </g>
  <g fill="#202b33" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="205" y="338">新访客</text>
    <text x="430" y="338">回访访客</text>
    <text x="655" y="338">整体</text>
  </g>
  <g fill="#52616b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="205" y="358">422 / 1,694</text>
    <text x="430" y="358">1,470 / 10,551</text>
    <text x="655" y="358">1,908 / 12,330</text>
  </g>
</svg>
